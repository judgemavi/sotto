[package]
name = "providers"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = "0.3.6"
async-openai = { version = "=0.41.3", default-features = false, features = ["responses", "rustls"] }
sotto-core = { package = "core", path = "../core" }
futures-util = "0.3.33"
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }
libc = "0.2.189"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
screen = { path = "../screen" }
secrecy = "0.10.3"
serde_json = { workspace = true }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "net", "rt", "time"] }
