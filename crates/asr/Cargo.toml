[package]
name = "asr"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.33"
hex = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.11.0"
sotto_core = { package = "core", path = "../core" }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
tracing.workspace = true
whisper-rs = { version = "0.15.1", features = ["metal"] }

[dev-dependencies]
hound = "3.5.1"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt"] }
