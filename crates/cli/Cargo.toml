[package]
name = "cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "sotto-cli"

[[bin]]
name = "sotto-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
asr = { path = "../asr" }
clap = { version = "4.5.54", features = ["derive", "env"] }
hound = "3.5.1"
png = "0.18.0"
prosody = { path = "../prosody" }
providers = { path = "../providers" }
rag = { path = "../rag" }
screen = { path = "../screen" }
serde.workspace = true
serde_json.workspace = true
sotto-core = { package = "core", path = "../core", features = ["serde"] }
tokio = { workspace = true, features = ["rt", "time"] }
insight = { path = "../insight" }
vad = { path = "../vad" }

[dev-dependencies]
tempfile = "3.20.0"
