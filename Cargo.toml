# Dependency policy: only dependencies used across most of Sotto belong in
# [workspace.dependencies]. Crate-specific dependencies stay in their owning crate.
[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/capture",
    "crates/asr",
    "crates/vad",
    "crates/prosody",
    "crates/providers",
    "crates/rag",
    "crates/mcp",
    "crates/app",
    "crates/cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Proprietary"

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["sync"] }
thiserror = "2.0.19"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
linker_messages = "allow"
dead_code = "deny"
unreachable_pub = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
unused_assignments = "deny"
unused_macros = "deny"
unreachable_code = "deny"
unreachable_patterns = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
mem_forget = "deny"
dbg_macro = "deny"
format_collect = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes = "deny" # only #[expect] with reason; it warns when the suppression goes stale
allow_attributes_without_reason = "deny" # every lint suppression states why
expect_used = "warn"
panic = "warn"
exit = "warn"
error_impl_error = "warn"
assertions_on_result_states = "warn"
tests_outside_test_module = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
or_fun_call = "deny"
redundant_clone = "deny"
needless_collect = "deny"
large_futures = "warn"
# Guard/temporary with significant Drop held across a match/if-let body — deadlock-shape hazard.
significant_drop_in_scrutinee = "deny"
missing_assert_message = "warn"
