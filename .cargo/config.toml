# The Swift bridge in crates/capture targets macOS 14 (Package.swift declares
# .macOS(.v14)), but rustc's link step does not inherit that deployment target.
# Without it the linker assumes an older minimum, resolves Swift concurrency
# against the Swift 5.5 back-deployment stub, and emits a reference to
# @rpath/libswift_Concurrency.dylib. That dylib does not exist on macOS 14+ —
# the concurrency runtime is folded into libswiftCore — so any binary linking
# the capture crate dies at startup with:
#
#   dyld: Library not loaded: @rpath/libswift_Concurrency.dylib
#         Reason: no LC_RPATH's found
#
# Setting the deployment target here applies to every cargo-invoked link in the
# workspace, so `cli`, `app` and the capture examples all get it. Keep this in
# step with Package.swift's platforms declaration.
[env]
MACOSX_DEPLOYMENT_TARGET = "14.0"

# whisper-rs-sys 0.14.1 can either regenerate its FFI bindings with the host
# libclang or copy the bindings shipped beside its vendored whisper.cpp source.
# The live bindgen pipeline with Xcode 26.4 resolves `whisper_full_params` as an
# opaque declaration when the crate adds its Metal header, while still emitting the complete
# 296-byte layout assertion. Use the crate's supported bundled-binding mode so
# local and CI builds consume the bindings released with that exact C source.
# This only selects Rust FFI declarations; the `metal` Cargo feature and the
# native Metal build remain enabled.
WHISPER_DONT_GENERATE_BINDINGS = { value = "1", force = true }
