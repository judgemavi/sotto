name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  workspace:
    name: Workspace / macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Install pinned Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64-workspace
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build workspace and Swift capture bridge
        run: cargo build --locked --workspace --all-features --target aarch64-apple-darwin
      - name: Test workspace
        run: cargo test --locked --workspace --all-features --target aarch64-apple-darwin

  headless-core:
    name: Headless core guard
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy
          targets: aarch64-apple-darwin
      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64-headless
          cache-on-failure: true
      - name: Reject GPUI in the headless dependency graph
        run: |
          set -euo pipefail
          if cargo tree --locked --prefix none \
            -p core -p capture -p vad -p asr -p prosody -p screen -p providers -p advisor -p rag -p cli \
            | grep -E '^gpui([_-]component)? v'; then
            echo 'GPUI entered the headless dependency graph' >&2
            exit 1
          fi
      - name: Build headless crates only
        run: >-
          cargo build
          --locked
          -p core -p capture -p vad -p asr -p prosody -p screen -p providers -p advisor -p rag -p cli
          --target aarch64-apple-darwin
      - name: Test headless crates only
        run: >-
          cargo test
          --locked
          -p core -p capture -p vad -p asr -p prosody -p screen -p providers -p advisor -p rag -p cli
          --target aarch64-apple-darwin
