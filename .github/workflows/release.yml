name: Release macOS

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  macos-arm64:
    name: Signed and notarized macOS arm64 artifact
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Install pinned Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin
      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64-release
      - name: Build release binary
        run: cargo build --locked --release -p app --target aarch64-apple-darwin
      - name: Assemble application bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/Sotto.app/Contents/MacOS
          cp target/aarch64-apple-darwin/release/app dist/Sotto.app/Contents/MacOS/sotto
          cp scripts/Info.plist dist/Sotto.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${RELEASE_TAG#v}" dist/Sotto.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" dist/Sotto.app/Contents/Info.plist
      - name: Sign application bundle
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: scripts/sign.sh dist/Sotto.app
      - name: Prepare notarization submission
        run: ditto -c -k --keepParent dist/Sotto.app dist/Sotto-notarization.zip
      - name: Write App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/notary/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/notary/AuthKey.p8"
      - name: Notarize and staple application bundle
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_PATH: ${{ runner.temp }}/notary/AuthKey.p8
        run: scripts/notarize.sh dist/Sotto-notarization.zip dist/Sotto.app
      - name: Remove notarization private key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary/AuthKey.p8"
      - name: Package stapled release artifact
        run: ditto -c -k --keepParent dist/Sotto.app dist/Sotto-macos-arm64.zip
      - name: Verify release artifact
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Sotto.app
          spctl --assess --type execute --verbose=4 dist/Sotto.app
          shasum -a 256 dist/Sotto-macos-arm64.zip > dist/Sotto-macos-arm64.zip.sha256
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Sotto-macos-arm64.zip
            dist/Sotto-macos-arm64.zip.sha256
      # Phase 4 updater hook: generate and sign a manifest that references the immutable
      # ZIP URL and SHA-256 above, then add the manifest and its signature to `files`.
